services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  control-plane:
    build:
      context: ../..
      dockerfile: infra/docker/control-plane.Dockerfile
    environment:
      IVM_CANONICAL_RUN_DB: /data/verification-runs.sqlite3
    ports:
      - "3000:3000"
    volumes:
      - ../../data:/data
    depends_on:
      - minio

  alpha-beta-crown-worker:
    build:
      context: ../..
      dockerfile: infra/docker/alpha-beta-crown-worker.Dockerfile
    depends_on:
      - minio
