[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivm-alpha-beta-crown-adapter"
version = "0.1.0"
description = "Phase 1 alpha-beta-CROWN adapter scaffold"
requires-python = ">=3.12"

[project.scripts]
ivm-alpha-beta-crown = "alpha_beta_crown_adapter.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

