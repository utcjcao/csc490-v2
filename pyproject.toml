[tool.ruff]
target-version = "py312"
line-length = 100
src = [
  "python/adapter-common/src",
  "python/alpha-beta-crown-adapter/src",
  "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]

